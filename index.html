<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>Forage</title>
<meta name="theme-color" content="#9C3A1F"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Forage"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --paper:#F7F1E6;--paper-deep:#EFE6D4;--ink:#211B15;--ink-soft:#5C5046;
  --terra:#BC4B2B;--terra-deep:#9C3A1F;--olive:#6B6A3A;--gold:#C8962B;
  --line:#D9CDB6;--card:#FFFCF6;--green:#3c6b2f;--green-bg:rgba(107,106,58,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(900px 500px at 100% -8%,rgba(188,75,43,.09),transparent 60%),
    radial-gradient(800px 500px at -10% 12%,rgba(107,106,58,.09),transparent 55%);
  min-height:100vh;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}

/* HEADER */
header{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  display:flex;align-items:baseline;gap:10px;
  position:sticky;top:0;z-index:150;
}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1;}
.tagline{font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--terra-deep);margin:0;}

/* LOCATION STRIP */
.loc-strip{
  background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;gap:8px;align-items:center;
  position:sticky;top:calc(env(safe-area-inset-top)+58px);z-index:140;
}
.btn-loc{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:13px;
  padding:9px 13px;border-radius:10px;cursor:pointer;border:none;color:#fff;background:var(--ink);white-space:nowrap;}
.btn-loc.ok{background:var(--olive);}
.loc-input-wrap{position:relative;flex:1;min-width:0;}
.loc-input-wrap .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-soft);}
input.loc-in{width:100%;font:inherit;font-size:13.5px;padding:9px 10px 9px 30px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);outline:none;}
.loc-hint{font-size:12px;color:var(--ink-soft);padding:6px 16px 0;display:flex;align-items:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--olive);flex-shrink:0;}

/* SECTIONS */
.sec{padding-top:14px;}

/* PANEL */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px;box-shadow:0 16px 36px -26px rgba(33,27,21,.4);margin:0 0 2px;}
label.fld{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);display:block;margin-bottom:7px;}
.row{display:flex;gap:7px;flex-wrap:wrap;}

/* CHIPS */
.chip{font-size:13px;font-weight:600;padding:8px 13px;border-radius:99px;cursor:pointer;
  white-space:nowrap;border:1.5px solid var(--line);background:transparent;color:var(--ink-soft);
  transition:all .15s;flex-shrink:0;}
.chip.on{border-color:var(--terra);background:var(--terra);color:#fff;}
.chip.olive.on{border-color:var(--olive);background:var(--olive);color:#fff;}
.chip.gold.on{border-color:var(--gold);background:var(--gold);color:#fff;}

select{width:100%;font:inherit;font-size:14px;font-weight:600;padding:10px 11px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:99px;background:var(--line);outline:none;margin-top:10px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--terra);cursor:pointer;border:3px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.18);}

.more-btn{margin-top:14px;display:inline-flex;align-items:center;gap:6px;background:none;border:none;
  cursor:pointer;font:inherit;font-weight:600;font-size:13px;color:var(--terra-deep);padding:0;}

/* GO ROW */
.go-row{display:flex;gap:9px;margin-top:16px;}
.btn-go{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;
  font-weight:700;font-size:15px;padding:14px;border-radius:13px;border:none;cursor:pointer;
  color:#fff;background:linear-gradient(180deg,var(--terra),var(--terra-deep));
  box-shadow:0 12px 24px -12px rgba(156,58,31,.65);}
.btn-go:disabled{opacity:.8;cursor:default;}
.btn-surprise{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;
  font-weight:700;font-size:14px;padding:14px 15px;border-radius:13px;
  border:1.5px solid var(--gold);background:rgba(200,150,43,.10);color:#7a5a10;cursor:pointer;white-space:nowrap;}
.btn-plain{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;
  font-weight:700;font-size:15px;padding:14px;border-radius:13px;border:none;cursor:pointer;
  color:#fff;background:linear-gradient(180deg,var(--olive),#4f4e2a);
  box-shadow:0 12px 24px -12px rgba(79,78,42,.65);}
.btn-plain:disabled{opacity:.8;cursor:default;}
.err{font-size:13px;color:var(--terra-deep);font-weight:600;margin-top:10px;}

/* SUB TABS */
.sub-tabs{display:flex;gap:5px;margin-top:16px;background:var(--paper-deep);padding:4px;border-radius:13px;}
.stab{flex:1;text-align:center;font-weight:700;font-size:13px;padding:9px;border-radius:9px;
  cursor:pointer;color:var(--ink-soft);border:none;background:transparent;}
.stab.on{background:var(--card);color:var(--ink);box-shadow:0 2px 7px -3px rgba(0,0,0,.28);}

/* RESULTS */
.results{margin-top:2px;}
.sec-title{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin:14px 0 0;}

/* CARDS */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:17px 17px 15px;margin-top:13px;box-shadow:0 14px 30px -24px rgba(33,27,21,.48);
  animation:rise .42s both ease;}
@keyframes rise{from{opacity:0;transform:translateY(13px);}to{opacity:1;transform:translateY(0);}}
.badge{position:absolute;top:-11px;left:14px;width:32px;height:32px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:900;font-size:15px;
  color:#fff;box-shadow:0 5px 12px -5px rgba(0,0,0,.45);}
.heart{position:absolute;top:13px;right:13px;width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;transition:all .14s;}
.heart.on{background:var(--terra);border-color:var(--terra);}
.rname{font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0;line-height:1.1;padding-right:40px;}
.meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;}
.pill-open{color:var(--green);background:var(--green-bg);}
.pill-closed{color:var(--terra-deep);background:rgba(188,75,43,.11);}
.pill-travel{color:var(--ink-soft);background:var(--paper-deep);}
.type-tag{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--terra-deep);background:rgba(188,75,43,.09);padding:3px 8px;border-radius:7px;}
.card-body{font-size:14px;line-height:1.5;color:var(--ink);margin:10px 0 0;}
.card-quote{font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;line-height:1.5;
  color:var(--ink-soft);margin:7px 0 0;}
.card-hours{font-size:12px;color:var(--ink-soft);margin:7px 0 0;}
.card-addr{font-size:12px;color:var(--ink-soft);margin:7px 0 0;display:flex;gap:4px;}
.actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;}
.act{display:inline-flex;align-items:center;gap:5px;font:inherit;font-weight:600;font-size:13px;
  text-decoration:none;padding:9px 13px;border-radius:10px;cursor:pointer;border:none;}

/* MAP */
.mapbox{height:400px;border-radius:16px;margin-top:13px;border:1px solid var(--line);overflow:hidden;z-index:0;}

/* SKELETON */
.skel{height:90px;border-radius:16px;margin-top:12px;
  background:linear-gradient(90deg,var(--paper-deep) 25%,var(--paper) 37%,var(--paper-deep) 63%);
  background-size:800px 100%;animation:shimmer 1.4s infinite linear;}
@keyframes shimmer{0%{background-position:-400px 0;}100%{background-position:400px 0;}}
.loading-msg{font-family:'Fraunces',serif;font-style:italic;font-size:15px;color:var(--ink-soft);
  display:flex;align-items:center;gap:8px;margin-top:18px;}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8);}50%{opacity:1;transform:scale(1);}}

/* REDDIT BUZZ */
.buzz-wrap{margin-top:18px;}
.buzz-title{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.buzz-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
.buzz-scroll::-webkit-scrollbar{display:none;}
.buzz-card{flex-shrink:0;width:220px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px;cursor:pointer;text-decoration:none;display:block;}
.buzz-card:hover{border-color:var(--terra);}
.buzz-sub{font-size:11px;font-weight:700;color:var(--terra-deep);margin-bottom:4px;}
.buzz-title-text{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.buzz-score{font-size:11px;color:var(--ink-soft);margin-top:6px;}
.buzz-matched{background:rgba(188,75,43,.08);border-color:var(--terra);}

/* SWITCH */
.switch-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.track{width:40px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex-shrink:0;}
.track.on{background:var(--olive);}
.knob{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;}
.track.on .knob{left:21px;}

/* SAVED */
.taste-card{background:var(--green-bg);border:1px solid rgba(107,106,58,.3);border-radius:14px;
  padding:13px 14px;margin-top:14px;font-size:13px;color:#4a4a1e;display:flex;gap:10px;}
.mode-badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;display:inline-block;margin-bottom:3px;}
.mode-food{color:var(--terra-deep);background:rgba(188,75,43,.10);}
.mode-parks{color:var(--olive);background:rgba(107,106,58,.12);}
.mode-play{color:#5a3a8a;background:rgba(90,58,138,.10);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--line);display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;padding:9px 0 7px;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-soft);
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;transition:color .15s;}
.nav-btn .ic{font-size:21px;line-height:1;}
.nav-btn.on{color:var(--terra);}

/* TOAST */
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;
  padding:11px 17px;border-radius:99px;box-shadow:0 8px 26px -8px rgba(0,0,0,.55);
  z-index:9999;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-3px);}
.foot{font-size:11.5px;color:var(--ink-soft);margin:20px 0 10px;text-align:center;line-height:1.5;}
.empty-state{text-align:center;padding:40px 0 20px;}

/* --- FRIEND REC MODAL & CARDS --- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.show{opacity:1;pointer-events:all;}
.sheet{width:100%;max-width:720px;background:var(--card);border-radius:22px 22px 0 0;padding:0 18px calc(env(safe-area-inset-bottom)+32px);max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);}
.overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;border-radius:99px;background:var(--line);margin:14px auto 18px;}
.sheet-title{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin:0 0 16px;}
.fgroup{margin-bottom:14px;}
.flabel{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:6px;}
input.finput,textarea.finput,select.finput{width:100%;font:inherit;font-size:14px;padding:11px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s;}
input.finput:focus,textarea.finput:focus,select.finput:focus{border-color:var(--terra);}
textarea.finput{resize:vertical;min-height:72px;line-height:1.5;}
.btn-sheet-save{width:100%;font:inherit;font-weight:700;font-size:16px;padding:15px;border-radius:13px;border:none;cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--terra),var(--terra-deep));margin-top:6px;box-shadow:0 10px 22px -10px rgba(156,58,31,.6);}
.add-rec-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:none;border:1.5px dashed var(--line);border-radius:11px;padding:11px 14px;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;margin-top:10px;transition:border-color .15s,color .15s;}
.friend-section{margin-top:22px;padding-top:16px;border-top:1.5px dashed rgba(107,106,58,.35);}
.friend-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.friend-label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--olive);}
.friend-card{border:1.5px solid rgba(107,106,58,.38)!important;background:rgba(107,106,58,.04)!important;}
.rec-badge{display:inline-block;background:var(--olive);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:7px;padding:2px 9px;margin-bottom:6px;}
.rec-by{font-size:12.5px;color:var(--olive);font-weight:700;margin:5px 0 0;}
.btn-remove-custom{background:none;border:none;cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:var(--terra-deep);padding:4px 0 0;}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>Forage</h1><span style="font-size:22px;">🍽️</span>
  <span class="tagline" style="margin-left:4px;">Your go-to for food &amp; fun nearby.</span>
</header>

<!-- SHARED LOCATION -->
<div class="loc-strip">
  <button id="locBtn" class="btn-loc"><span id="locIcon">◎</span> <span id="locLabel">My location</span></button>
  <div class="loc-input-wrap">
    <span class="ic">📍</span>
    <input id="place" class="loc-in" type="text" placeholder="City or neighborhood…"/>
  </div>
</div>
<p id="locHint" class="loc-hint" style="display:none;"></p>

<!-- ============================================================ FOOD SECTION -->
<div class="sec" id="sec-food">
<div class="wrap">

  <div class="panel">
    <label class="fld">Meal</label>
    <div class="row" id="food-meals"></div>

    <div class="row" style="margin-top:14px;gap:12px;">
      <div style="flex:1;min-width:140px;">
        <label class="fld">Cuisine</label>
        <select id="food-cuisine"></select>
      </div>
      <div style="flex:1;min-width:140px;">
        <label class="fld">Price</label>
        <div class="row" id="food-prices"></div>
      </div>
    </div>

    <button class="more-btn" id="food-more-btn">⚙ More options</button>
    <div id="food-more" style="display:none;margin-top:13px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <label class="fld" style="margin-bottom:0;">Distance</label>
        <span id="food-rad-label" style="font-size:12px;font-weight:700;color:var(--terra-deep);">within 3 mi</span>
      </div>
      <input id="food-radius" type="range" min="0.5" max="10" step="0.5" value="3"/>

      <label class="fld" style="margin-top:14px;">🌿 Dietary</label>
      <div class="row" id="food-dietary"></div>

      <div class="row" style="margin-top:14px;gap:12px;">
        <div>
          <label class="fld">Hours</label>
          <button class="chip on" id="food-open">Open now</button>
        </div>
        <div style="flex:1;">
          <label class="fld">Rank by</label>
          <div class="row" id="food-sorts"></div>
        </div>
      </div>

      <div class="switch-row">
        <div>
          <label class="fld" style="margin-bottom:2px;">Learn from my favorites</label>
          <span style="font-size:11.5px;color:var(--ink-soft);" id="food-learn-sub">Tunes results to your saved spots</span>
        </div>
        <div class="track on" id="food-learn-track"><div class="knob"></div></div>
      </div>
    </div>

    <div class="go-row">
      <button class="btn-go" id="food-go">🔍 Find top 10</button>
      <button class="btn-surprise" id="food-surprise">🎲 Surprise me</button>
    </div>
    <p class="err" id="food-err" style="display:none;"></p>
    <button class="add-rec-btn" onclick="openModal('food')">&#x2795; Add a recommended restaurant</button>
  </div>

  <div id="food-loading" style="display:none;">
    <div class="loading-msg">
      <span style="display:inline-flex;gap:3px;">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--terra);animation:pulse 1.2s 0s infinite;"></span>
        <span style="width:6px;height:6px;border-radius:50%;background:var(--terra);animation:pulse 1.2s .2s infinite;"></span>
        <span style="width:6px;height:6px;border-radius:50%;background:var(--terra);animation:pulse 1.2s .4s infinite;"></span>
      </span>
      <span id="food-load-line">Scanning fresh reviews…</span>
    </div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>

  <div class="sub-tabs" id="food-tabs" style="display:none;">
    <button class="stab on" id="food-tab-list">📋 List</button>
    <button class="stab" id="food-tab-map">🗺 Map</button>
  </div>
  <div id="food-learn-note"></div>
  <div class="results" id="food-results"></div>
  <div id="food-map" class="mapbox" style="display:none;"></div>
  <div id="food-buzz"></div>

</div>
</div>

<!-- ============================================================ PARKS SECTION -->
<div class="sec" id="sec-parks" style="display:none;">
<div class="wrap">

  <div class="panel">
    <label class="fld">Park type</label>
    <div class="row" id="parks-types"></div>

    <button class="more-btn" id="parks-more-btn">⚙ More options</button>
    <div id="parks-more" style="display:none;margin-top:13px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <label class="fld" style="margin-bottom:0;">Distance</label>
        <span id="parks-rad-label" style="font-size:12px;font-weight:700;color:var(--olive);">within 5 mi</span>
      </div>
      <input id="parks-radius" type="range" min="0.5" max="20" step="0.5" value="5" style="accent-color:var(--olive);"/>
      <div style="margin-top:14px;display:flex;gap:8px;align-items:center;">
        <label class="fld" style="margin-bottom:0;">Hours</label>
        <button class="chip olive" id="parks-open">Open now</button>
      </div>
      <label class="fld" style="margin-top:14px;">Rank by</label>
      <div class="row" id="parks-sorts"></div>
    </div>

    <div class="go-row" style="margin-top:16px;">
      <button class="btn-plain" id="parks-go">🌳 Find parks</button>
    </div>
    <p class="err" id="parks-err" style="display:none;"></p>

<div id="toast" class="toast"></div>

<script>
/* ====================================================
   FORAGE — unified food / parks / entertainment finder
   ==================================================== */

const API = "/api/search";
const FAV_KEY = "forage_v3";
const CUSTOM_KEY = "forage_custom_v1";
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const LOAD_MSGS = {
  food: ["Pinpointing your spot…","Scanning fresh reviews…","Checking Reddit buzz…","Weighing local favorites…","Plating your top 10…"],
  parks: ["Finding parks nearby…","Checking trail reviews…","Scanning hidden gems…"],
  play: ["Scouting entertainment…","Checking opening hours…","Ranking your options…"],
};

// ──────────── DATA CONSTANTS ────────────
const CUISINES = ["Any","Italian","Japanese","Mexican","Thai","Indian","Chinese","Korean","Vietnamese","Mediterranean","American","French","BBQ","Seafood","Pizza","Sushi","Ramen","Burgers","Steakhouse","Middle Eastern","Greek","Spanish","Ethiopian","Brunch"];
const MEALS = [["Breakfast","🍳"],["Lunch","🥗"],["Dinner","🍽️"],["Cafe","☕"],["Matcha","🍵"]];
const DIETARY = ["Vegetarian","Vegan","Gluten-free","Halal"];
const SORTS = [["match","Best match"],["rating","Top rated"],["distance","Closest"],["value","Best value"]];
const PARK_TYPES = ["Any","Hiking","Dog Park","Playground","Sports","Garden","Beach","Nature Reserve"];
const PLAY_CATS = ["Any","Arcade","Bowling","Movies","Mini Golf","Escape Room","Live Music","Laser Tag","Go-Kart","Comedy","Trampoline","Karaoke"];

// ──────────── SHARED LOCATION STATE ────────────
const loc = { coords: null, status: "idle" };

// ──────────── PER-SECTION STATE ────────────
const S = {
  food:  { meal:"Dinner", cuisine:"Any", prices:[1,2], dietary:[], radius:3,  openNow:true,  sort:"match", learn:true,  view:"list", results:[], buzz:[] },
  parks: { type:"Any",    radius:5,      openNow:false, sort:"match", view:"list", results:[], buzz:[] },
  play:  { category:"Any", prices:[1,2,3,4], radius:5, openNow:true, sort:"match", view:"list", results:[], buzz:[] },
};
let curSec = "food";
const leafletMaps = {};
const leafletMarkers = {};

// ──────────── FAVORITES ────────────
function loadFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||"[]"); }catch{ return []; } }
function saveFavs(f){ localStorage.setItem(FAV_KEY,JSON.stringify(f)); updateSavedCount(); }
function isFav(id){ return loadFavs().some(x=>x.id===id); }
function toggleFav(place){
  let f = loadFavs();
  if(f.some(x=>x.id===place.id)){ f=f.filter(x=>x.id!==place.id); toast("Removed from saved"); }
  else { f.push({id:place.id,name:place.name,type:place.type,rating:place.rating,reviewCount:place.reviewCount,priceLevel:place.priceLevel,address:place.address,lat:place.lat,lng:place.lng,mapsUri:place.mapsUri,phone:place.phone,website:place.website,mode:place.mode||curSec}); toast("Saved ♥"); }
  saveFavs(f); return f;
}
function updateSavedCount(){
  const n=loadFavs().length;
  document.getElementById("nav-saved-ct").textContent = n>0?"Saved ("+n+")":"Saved";
}


// ------------ CUSTOM / FRIEND RECOMMENDATIONS ------------
function loadCustom(){ try{ return JSON.parse(localStorage.getItem(CUSTOM_KEY)||"[]"); }catch{ return []; } }
function saveCustom(arr){ localStorage.setItem(CUSTOM_KEY,JSON.stringify(arr)); }
function deleteCustom(id){ saveCustom(loadCustom().filter(function(x){ return x.id!==id; })); }

var _mmode = "food";

function openModal(sec){
  _mmode = sec||curSec||"food";
  document.querySelectorAll("#modal-modes .chip").forEach(function(b){ b.classList.toggle("on",b.dataset.mode===_mmode); });
  refreshSubtype();
  document.getElementById("add-overlay").classList.add("show");
  setTimeout(function(){ var n=document.getElementById("add-name"); if(n) n.focus(); },330);
}
function closeModal(){
  document.getElementById("add-overlay").classList.remove("show");
  ["add-name","add-recby","add-notes","add-address","add-phone","add-website"].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=""; });
}
(function(){
  var ov=document.getElementById("add-overlay");
  if(ov) ov.addEventListener("click",function(e){ if(e.target===ov) closeModal(); });
})();
function setModalMode(mode){
  _mmode=mode;
  document.querySelectorAll("#modal-modes .chip").forEach(function(b){ b.classList.toggle("on",b.dataset.mode===mode); });
  refreshSubtype();
}
function refreshSubtype(){
  var sel=document.getElementById("add-subtype");
  var lbl=document.getElementById("subtype-label");
  if(!sel||!lbl) return;
  var opts=[];
  if(_mmode==="food"){ opts=CUISINES; lbl.textContent="Cuisine"; }
  else if(_mmode==="parks"){ opts=PARK_TYPES; lbl.textContent="Park type"; }
  else{ opts=PLAY_CATS; lbl.textContent="Category"; }
  sel.innerHTML=opts.map(function(o){ return "<option>"+o+"</option>"; }).join("");
}
function saveCustomPlace(){
  var nameEl=document.getElementById("add-name");
  var name=(nameEl.value||"").trim();
  if(!name){ nameEl.style.borderColor="var(--terra)"; nameEl.focus(); return; }
  nameEl.style.borderColor="";
  var sub=(document.getElementById("add-subtype").value||"Any");
  var place={
    id:"custom_"+Date.now(), name:name, mode:_mmode,
    cuisine:_mmode==="food"?sub:null,
    parkType:_mmode==="parks"?sub:null,
    playCategory:_mmode==="play"?sub:null,
    address:(document.getElementById("add-address").value||"").trim(),
    notes:(document.getElementById("add-notes").value||"").trim(),
    recommendedBy:(document.getElementById("add-recby").value||"").trim(),
    phone:(document.getElementById("add-phone").value||"").trim()||null,
    website:(document.getElementById("add-website").value||"").trim()||null,
    addedAt:Date.now(),
  };
  var arr=loadCustom(); arr.push(place); saveCustom(arr);
  closeModal();
  toast("\u2705 "+name+" added!");
  if(curSec==="saved") renderSaved();
  else if(S[_mmode]&&S[_mmode].results.length) renderList(_mmode);
}
function matchCustom(sec){
  var all=loadCustom().filter(function(x){ return x.mode===sec; });
  if(!all.length) return [];
  var s=S[sec];
  return all.filter(function(x){
    if(sec==="food"){ var cur=s.cuisine||"Any"; return cur==="Any"||(x.cuisine||"Any")==="Any"||x.cuisine===cur; }
    if(sec==="parks"){ var cur=s.type||"Any"; return cur==="Any"||(x.parkType||"Any")==="Any"||x.parkType===cur; }
    var cur=s.category||"Any"; return cur==="Any"||(x.playCategory||"Any")==="Any"||x.playCategory===cur;
  });
}
function renderFriendRecs(sec){
  var matches=matchCustom(sec);
  if(!matches.length) return;
  var container=document.getElementById(sec+"-results");
  if(!container) return;
  var wrap=document.createElement("div");
  wrap.className="friend-section";
  wrap.innerHTML='<div class="friend-header"><span style="font-size:18px;">\ud83e\udd1d</span><span class="friend-label">Recommended by a friend</span></div>';
  matches.forEach(function(x,i){
    var c=document.createElement("article");
    c.className="card friend-card"; c.style.animationDelay=(i*0.06)+"s";
    var sub=sec==="food"?(x.cuisine||"Any"):sec==="parks"?(x.parkType||"Any"):(x.playCategory||"Any");
    var maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x.name+" "+(x.address||""));
    c.innerHTML=
      '<span class="rec-badge">\ud83e\udd1d Friend rec</span>'+
      '<h3 class="rname" style="padding-right:8px;">'+x.name+'</h3>'+
      '<div class="meta"><span>'+sub+'</span>'+(x.address?'<span> &middot; '+x.address+'</span>':'')+' </div>'+
      (x.recommendedBy?'<p class="rec-by">Recommended by '+x.recommendedBy+'</p>':'')+
      (x.notes?'<p class="card-quote">\u201c'+x.notes+'\u201d</p>':'')+
      (x.address?'<p class="card-addr">\ud83d\udccd <span>'+x.address+'</span></p>':'')+
      '<div class="actions" style="flex-wrap:wrap;align-items:center;">'+
        '<a class="act" href="'+maps+'" target="_blank" rel="noreferrer" style="background:var(--olive);color:#fff;">\ud83e\uddad Directions</a>'+
        (x.phone?'<a class="act" href="tel:'+x.phone+'" style="border:1.5px solid var(--line);color:var(--ink);">\ud83d\udcde Call</a>':'')+
        (x.website?'<a class="act" href="'+x.website+'" target="_blank" rel="noreferrer" style="border:1.5px solid var(--line);color:var(--ink);">\ud83c\udf10 Site</a>':'')+
        '<button class="btn-remove-custom" onclick="removeCustom(\''+x.id+'\',\''+sec+'\')">&#215; Remove</button>'+
      '</div>';
    wrap.appendChild(c);
  });
  container.appendChild(wrap);
}
function removeCustom(id,sec){
  deleteCustom(id);
  toast("Removed");
  if(curSec==="saved"){ renderSaved(); return; }
  var container=document.getElementById(sec+"-results");
  if(container){ var old=container.querySelector(".friend-section"); if(old) old.remove(); renderFriendRecs(sec); }
}

// ──────────── TASTE PROFILE ────────────
function tasteProfile(){
  const f=loadFavs().filter(x=>x.mode==="food");
  if(f.length<2) return null;
  const cuis={}, price={};
  f.forEach(x=>{ if(x.type) cuis[x.type]=(cuis[x.type]||0)+1; if(x.priceLevel) price[x.priceLevel]=(price[x.priceLevel]||0)+1; });
  const topCuis=Object.entries(cuis).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  const topPrice=Object.entries(price).sort((a,b)=>b[1]-a[1])[0];
  return { count:f.length, cuisineWeights:cuis, topCuisines:topCuis, favPrice:topPrice?+topPrice[0]:null };
}
function tasteBoost(place,prof){
  if(!prof) return 0;
  let b=0;
  for(const c in prof.cuisineWeights){
    if(place.type&&(place.type.toLowerCase().includes(c.toLowerCase())||c.toLowerCase().includes(place.type.toLowerCase())))
      b+=0.3*Math.min(3,prof.cuisineWeights[c]);
  }
  if(prof.favPrice&&place.priceLevel===prof.favPrice) b+=0.4;
  return b;
}

// ──────────── HELPERS ────────────
function miles(a,b,c,d){const R=3958.8,t=x=>x*Math.PI/180;const dLat=t(c-a),dLon=t(d-b);const h=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
function stars(v){v=Math.max(0,Math.min(5,+v||0));let s="";for(let i=0;i<5;i++){const f=Math.max(0,Math.min(1,v-i));s+=`<span style="position:relative;display:inline-block;width:14px;color:var(--line);">★<span style="position:absolute;left:0;top:0;width:${f*100}%;overflow:hidden;color:var(--gold);">★</span></span>`;}return s;}
function travelText(d){if(d==null)return "";const walk=Math.round(d/3.1*60),drive=Math.max(1,Math.round(d*1.3/22*60));return d<=1.2?`🚶 ~${walk}min · 🚗 ~${drive}min`:`🚗 ~${drive}min`;}
function todayHours(arr){if(!arr||!arr.length)return null;const day=DAYS[new Date().getDay()];const line=arr.find(s=>s.toLowerCase().startsWith(day.toLowerCase()));return line?line.replace(day+": ",""):null;}
function priceStr(n){return n?"$".repeat(Math.max(1,Math.min(4,n))):""}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2000);}
function showErr(sec,msg){const e=document.getElementById(sec+"-err");e.textContent=msg;e.style.display="block";}
function hideErr(sec){document.getElementById(sec+"-err").style.display="none";}

// ──────────── LOCATION ────────────
function setupLocation(){
  document.getElementById("locBtn").onclick=()=>{
    const hint=document.getElementById("locHint");
    if(!navigator.geolocation){hint.style.display="flex";hint.style.color="var(--terra-deep)";hint.innerHTML="Location unavailable — type a place instead.";return;}
    document.getElementById("locIcon").textContent="◍";
    document.getElementById("locLabel").textContent="Locating…";
    navigator.geolocation.getCurrentPosition(
      pos=>{loc.coords={lat:pos.coords.latitude,lng:pos.coords.longitude};loc.status="ok";
        document.getElementById("place").value="";
        document.getElementById("locBtn").classList.add("ok");
        document.getElementById("locIcon").textContent="◉";
        document.getElementById("locLabel").textContent="Located";
        hint.style.display="flex";hint.style.color="var(--ink-soft)";
        hint.innerHTML='<span class="dot"></span>Pinned to your current location.';},
      ()=>{loc.status="denied";document.getElementById("locIcon").textContent="◎";document.getElementById("locLabel").textContent="My location";
        hint.style.display="flex";hint.style.color="var(--terra-deep)";hint.textContent="Location access off — type a place above instead.";},
      {enableHighAccuracy:true,timeout:10000}
    );
  };
  document.getElementById("place").oninput=()=>{if(document.getElementById("place").value.trim()) document.getElementById("locHint").style.display="none";};
}

// ──────────── BUILD CONTROLS ────────────
function buildFoodControls(){
  // meals
  const me=document.getElementById("food-meals");
  MEALS.forEach(([id,g])=>{const b=document.createElement("button");b.className="chip"+(id===S.food.meal?" on":"");b.innerHTML=g+" "+id;b.onclick=()=>{S.food.meal=id;[...me.children].forEach(c=>c.classList.remove("on"));b.classList.add("on");};me.appendChild(b);});
  // cuisine
  const cs=document.getElementById("food-cuisine");CUISINES.forEach(c=>{const o=document.createElement("option");o.textContent=c;cs.appendChild(o);});cs.onchange=()=>S.food.cuisine=cs.value;
  // prices
  const pe=document.getElementById("food-prices");["$","$$","$$$","$$$$"].forEach((p,i)=>{const lvl=i+1;const b=document.createElement("button");b.className="chip olive"+(S.food.prices.includes(lvl)?" on":"");b.textContent=p;b.onclick=()=>{if(S.food.prices.includes(lvl)){S.food.prices=S.food.prices.filter(x=>x!==lvl);b.classList.remove("on");}else{S.food.prices.push(lvl);b.classList.add("on");}};pe.appendChild(b);});
  // dietary
  const de=document.getElementById("food-dietary");DIETARY.forEach(d=>{const b=document.createElement("button");b.className="chip olive";b.textContent=d;b.onclick=()=>{if(S.food.dietary.includes(d)){S.food.dietary=S.food.dietary.filter(x=>x!==d);b.classList.remove("on");}else{S.food.dietary.push(d);b.classList.add("on");}};de.appendChild(b);});
  // sorts
  const so=document.getElementById("food-sorts");SORTS.forEach(([id,lbl])=>{const b=document.createElement("button");b.className="chip"+(id===S.food.sort?" on":"");b.textContent=lbl;b.onclick=()=>{S.food.sort=id;[...so.children].forEach(c=>c.classList.remove("on"));b.classList.add("on");if(S.food.results.length)renderList("food");};so.appendChild(b);});
  // radius
  document.getElementById("food-radius").oninput=e=>{S.food.radius=+e.target.value;document.getElementById("food-rad-label").textContent="within "+S.food.radius+" mi";};
  // open now
  const ob=document.getElementById("food-open");ob.onclick=()=>{S.food.openNow=!S.food.openNow;ob.classList.toggle("on",S.food.openNow);};
  // learn toggle
  document.getElementById("food-learn-track").onclick=()=>{S.food.learn=!S.food.learn;document.getElementById("food-learn-track").classList.toggle("on",S.food.learn);if(S.food.results.length)renderList("food");refreshLearnNote();};
  // more toggle
  document.getElementById("food-more-btn").onclick=()=>{const x=document.getElementById("food-more");const op=x.style.display==="none";x.style.display=op?"block":"none";document.getElementById("food-more-btn").innerHTML=op?"⚙ Fewer options":"⚙ More options";};
  // go + surprise
  document.getElementById("food-go").onclick=()=>doSearch("food");
  document.getElementById("food-surprise").onclick=surpriseMe;

// ──────────── SEARCH ────────────
let loadTimers = {};
async function doSearch(sec){
  hideErr(sec);
  if(location.protocol!=="http:"&&location.protocol!=="https:"){showErr(sec,"Open the app from your https://…vercel.app URL, not a local file.");return;}
  if(!loc.coords&&!document.getElementById("place").value.trim()){showErr(sec,"Set your location first — tap 'My location' or type a place.");return;}

  const loadEl=document.getElementById(sec+"-loading");
  const tabsEl=document.getElementById(sec+"-tabs");
  document.getElementById(sec+"-results").innerHTML="";
  document.getElementById(sec+"-map").style.display="none";
  document.getElementById(sec+"-buzz").innerHTML="";
  tabsEl.style.display="none";
  loadEl.style.display="block";
  document.getElementById(sec+"-go")||document.getElementById("food-go");
  const goBtn=document.getElementById(sec+"-go")||document.getElementById("play-go")||document.getElementById("parks-go");
  if(goBtn) goBtn.disabled=true;
  const msgs=LOAD_MSGS[sec];
  let mi=0;document.getElementById(sec+"-load-line").textContent=msgs[0];
  loadTimers[sec]=setInterval(()=>{mi=(mi+1)%msgs.length;document.getElementById(sec+"-load-line").textContent=msgs[mi];},1700);

  try{
    const endpoint=new URL(API,location.origin).href;
    const s=S[sec];
    const body={
      mode:sec,
      lat:loc.coords?.lat, lng:loc.coords?.lng,
      placeText:document.getElementById("place").value.trim(),
      radiusMiles:s.radius, openNow:s.openNow,
    };
    if(sec==="food"){ body.meal=s.meal; body.cuisine=s.cuisine; body.prices=s.prices; body.dietary=s.dietary; }
    else if(sec==="parks"){ body.parkType=s.type; }
    else{ body.playCategory=s.category; body.prices=s.prices; }

    const res=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let data; const raw=await res.text();
    try{ data=JSON.parse(raw); }
    catch{ throw new Error(res.status===404?"Backend not found (404). Check that api/search.js is deployed and vercel.json is in your repo root.":"Unexpected server response. Try again in a moment."); }
    if(!res.ok) throw new Error(data.error||"Request failed ("+res.status+").");

    S[sec].results=(data.results||[]).map(x=>{
      if(loc.coords&&x.lat&&x.lng) x._d=miles(loc.coords.lat,loc.coords.lng,x.lat,x.lng);
      x.mode=sec; return x;
    });
    S[sec].buzz=data.buzz||[];

    if(!S[sec].results.length){ document.getElementById(sec+"-results").innerHTML='<p class="foot">No matches — try widening distance or adjusting filters.</p>'; }
    else{ tabsEl.style.display="flex"; switchView(sec,"list"); }
    if(S[sec].buzz.length) renderBuzz(sec);
  }catch(e){
    showErr(sec, e.message==="Load failed"||e.message.includes("fetch")
      ? "Couldn't reach the server. Check your connection."
      : e.message);
  }finally{
    clearInterval(loadTimers[sec]); loadEl.style.display="none";
    if(goBtn) goBtn.disabled=false;
  }
}

// ──────────── RANKING ────────────
function ranked(sec){
  const s=S[sec]; const prof=sec==="food"?tasteProfile():null;
  let r=[...s.results];
  if(s.sort==="rating") r.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(s.sort==="distance") r.sort((a,b)=>(a._d??1e9)-(b._d??1e9));
  else if(s.sort==="value") r.sort((a,b)=>(b.rating||0)/(b.priceLevel||3)-(a.rating||0)/(a.priceLevel||3));
  else{
    r.sort((a,b)=>{
      const base=x=>(x.rating||0)*Math.log10((x.reviewCount||0)+10);
      const boost=sec==="food"&&s.learn?tasteBoost:()=>0;
      return base(b)+boost(b,prof)-(base(a)+boost(a,prof));
    });
  }
  return r.slice(0,10);
}

  const th=todayHours(x.hours);
  const fav=isFav(x.id);
  const modeClass=sec==="parks"?"mode-parks":sec==="play"?"mode-play":"mode-food";
  const buzzMatch=S[sec].buzz.some(b=>x.name&&b.title.toLowerCase().includes(x.name.toLowerCase().split(" ")[0]));
  return `
    <div class="badge" style="background:${badgeBg};">${isFirst?"★":(i+1)}</div>
    <button class="heart${fav?" on":""}" data-id="${x.id}" data-sec="${sec}">${fav?"♥":"♡"}</button>

    <h3 class="rname">${x.name}</h3>
    <div class="meta">
      ${stars(x.rating)}<span style="font-weight:700;font-size:13px;color:var(--ink);">${(x.rating??0).toFixed(1)}</span>
      ${x.reviewCount?`<span>(${(+x.reviewCount).toLocaleString()})</span>`:""}
      ${x.priceLevel&&sec!=="parks"?`<span>· ${priceStr(x.priceLevel)}</span>`:""}
      <span>· ${x.type}</span>
      ${x._d!=null?`<span>· ${x._d<0.1?"<0.1":x._d.toFixed(1)} mi</span>`:""}
      ${openTag}
      ${x._d!=null?`<span class="pill pill-travel">${travelText(x._d)}</span>`:""}
    </div>
    <span class="mode-badge ${modeClass}">${sec==="parks"?"🌳 Park":sec==="play"?"🎮 Entertainment":"🍽️ "+x.type}</span>
    ${x.summary?`<p class="card-body">${x.summary}</p>`:""}
    ${x.topReview?`<p class="card-quote">"${x.topReview.length>180?x.topReview.slice(0,180)+"…":x.topReview}"</p>`:""}
    ${th?`<p class="card-hours">🕒 Today: ${th}</p>`:""}
    ${x.address?`<p class="card-addr">📍 <span>${x.address}</span></p>`:""}
    <div class="actions">
      <a class="act" href="${maps}" target="_blank" rel="noreferrer" style="background:var(--terra);color:#fff;">🧭 Directions</a>
      ${x.phone?`<a class="act" href="tel:${x.phone}" style="border:1.5px solid var(--line);color:var(--ink);">📞 Call</a>`:""}
      ${x.website?`<a class="act" href="${x.website}" target="_blank" rel="noreferrer" style="border:1.5px solid var(--line);color:var(--ink);">🌐 Site</a>`:""}
    </div>`;
}

// ──────────── RENDER MAP ────────────
function renderMap(sec){
  const mapEl=document.getElementById(sec+"-map");
  mapEl.style.display="block";
  const r=ranked(sec);

  if(leafletMaps[sec]){
    leafletMaps[sec].remove();
    delete leafletMaps[sec];
    leafletMarkers[sec]=[];
  }

  const m=L.map(sec+"-map",{scrollWheelZoom:false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{attribution:"© OpenStreetMap contributors, © CARTO",maxZoom:19}).addTo(m);
  leafletMaps[sec]=m;
  leafletMarkers[sec]=[];

  const pts=[];
  const colors={"food":"#9C3A1F","parks":"#6B6A3A","play":"#7b4ab8"};
  const col=colors[sec]||"#9C3A1F";

  r.forEach((x,i)=>{
    if(x.lat==null||x.lng==null) return;
    const isFirst=i===0;
    const pinColor=isFirst?"#C8962B":col;
    const icon=L.divIcon({
      className:"",
      html:`<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${pinColor};display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.4);"><span style="transform:rotate(45deg);font-weight:800;font-size:13px;color:#fff;font-family:serif;">${i+1}</span></div>`,
      iconSize:[30,30],iconAnchor:[15,28]
    });
    const maps=x.mapsUri||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(x.name));
    const mk=L.marker([x.lat,x.lng],{icon}).addTo(m).bindPopup(
      `<b style="font-family:sans-serif;font-size:13px;">${i+1}. ${x.name}</b><br/><span style="font-size:12px;">★ ${(x.rating||0).toFixed(1)}${x.priceLevel&&sec!=="parks"?" · "+priceStr(x.priceLevel):""}${x._d!=null?" · "+x._d.toFixed(1)+" mi":""}</span><br/><a href="${maps}" target="_blank" style="font-size:12px;">Directions →</a>`
    );
    leafletMarkers[sec].push(mk); pts.push([x.lat,x.lng]);
  });
  if(loc.coords){
    const me=L.circleMarker([loc.coords.lat,loc.coords.lng],{radius:8,color:"#6B6A3A",fillColor:"#6B6A3A",fillOpacity:.9}).addTo(m).bindPopup('<span style="font-size:12px;">📍 You are here</span>');
    leafletMarkers[sec].push(me); pts.push([loc.coords.lat,loc.coords.lng]);
  }
  if(pts.length) m.fitBounds(pts,{padding:[40,40],maxZoom:15});
  setTimeout(()=>m.invalidateSize(),150);
}

function renderBuzz(sec){
  const buzz=S[sec].buzz;
  if(!buzz||!buzz.length) return;
  const el=document.getElementById(sec+"-buzz");
  const secLabel=sec==="food"?"restaurants":sec==="parks"?"parks":"entertainment";
  const r=ranked(sec);
  const names=r.map(x=>x.name.toLowerCase().split(" ")[0]).filter(n=>n.length>3);
  el.innerHTML=`<div class="buzz-wrap"><p class="buzz-title">💬 What Reddit is saying about ${secLabel} nearby</p><div class="buzz-scroll" id="${sec}-buzz-scroll"></div></div>`;
  const scroll=document.getElementById(sec+"-buzz-scroll");
  buzz.forEach(b=>{
    const matched=names.some(n=>b.title.toLowerCase().includes(n));
    const a=document.createElement("a");
    a.className="buzz-card"+(matched?" buzz-matched":"");
    a.href=b.url; a.target="_blank"; a.rel="noreferrer";
    a.innerHTML=`<div class="buzz-sub">r/${b.sub}</div><div class="buzz-title-text">${b.title}</div><div class="buzz-score">▲ ${b.score} upvotes${matched?" · 📣 matches your results":""}</div>`;
    scroll.appendChild(a);
  });
}

        '<h3 class="rname" style="padding-right:40px;">'+x.name+'</h3>'+
        '<div class="meta">'+
          stars(x.rating)+'<span style="font-weight:700;font-size:13px;color:var(--ink);">'+(x.rating==null?0:x.rating).toFixed(1)+'</span>'+
          (x.reviewCount?'<span>('+(+x.reviewCount).toLocaleString()+')</span>':'')+
          (x.priceLevel&&x.mode!=="parks"?'<span>&middot; '+priceStr(x.priceLevel)+'</span>':'')+
          '<span>&middot; '+(x.type||"")+'</span>'+
          (x._d!=null?'<span>&middot; '+(x._d<0.1?"<0.1":x._d.toFixed(1))+' mi</span>':'')+
        '</div>'+
        '<span class="mode-badge '+modeClass+'">'+modeLabel+'</span>'+
        (x.address?'<p class="card-addr">\ud83d\udccd <span>'+x.address+'</span></p>':'')+
        '<div class="actions">'+
          '<a class="act" href="'+maps+'" target="_blank" rel="noreferrer" style="background:var(--terra);color:#fff;">\ud83e\uddad Directions</a>'+
          (x.phone?'<a class="act" href="tel:'+x.phone+'" style="border:1.5px solid var(--line);color:var(--ink);">\ud83d\udcde Call</a>':'')+
          (x.website?'<a class="act" href="'+x.website+'" target="_blank" rel="noreferrer" style="border:1.5px solid var(--line);color:var(--ink);">\ud83c\udf10 Site</a>':'')+
        '</div>';
      starSec.appendChild(c);
    });
  }
  el.appendChild(starSec);
  wireHearts(el);
}

// ──────────── INIT ────────────
setupLocation();
buildFoodControls();
buildParksControls();
buildPlayControls();
updateSavedCount();
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
